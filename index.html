<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Albert Simon</title>
</head>
<body>
    <main>
    <header>Számológép</header>
    <article>
        <section id="muvelet">
            <p>12+3</p>
        </section>
        <section id ="gombok">
            <div id="elso">
                <button id="7" class = "szamok">7</button>
                <button id="8" class = "szamok">8</button>
                <button id="9" class = "szamok">9</button>
                <button id="osztas" class="muveletek">/</button>
            </div>
            <div id="masodik">
                <button id="4" class = "szamok">4</button>
                <button id="5" class = "szamok">5</button>
                <button id="6" class = "szamok">6</button>
                <button id="szorzas" class="muveletek">*</button>
            </div>
            <div id="harmadik">
                <button id="1" class = "szamok">1</button>
                <button id="2" class = "szamok">2</button>
                <button id="3" class = "szamok">3</button>
                <button id="minusz" class="muveletek">-</button>
            </div>
            <div id="negyedik">
                <button id="torol" class="muveletek">C</button>
                <button id="0" class = "szamok">0</button>
                <button id="egyenlo" class="muveletek">=</button>
                <button id="plusz" class="muveletek">+</button>
            </div>
        </section>
    </article>
    </main>
</body>
</html>
